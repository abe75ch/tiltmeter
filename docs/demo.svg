acity:0}50.94%,97%{opacity:1}100%{opacity:0}}.l18{animation:l18 15.9s infinite}@keyframes l19{0%,53.76%{opacity:0}53.77%,97%{opacity:1}100%{opacity:0}}.l19{animation:l19 15.9s infinite}@keyframes l20{0%,56.59%{opacity:0}56.60%,97%{opacity:1}100%{opacity:0}}.l20{animation:l20 15.9s infinite}@keyframes l21{0%,59.42%{opacity:0}59.43%,97%{opacity:1}100%{opacity:0}}.l21{animation:l21 15.9s infinite}</style>
<rect width="900" height="504" rx="10" fill="#0d1117"/>
<circle cx="20" cy="18" r="6" fill="#ff5f56"/><circle cx="40" cy="18" r="6" fill="#ffbd2e"/><circle cx="60" cy="18" r="6" fill="#27c93f"/>
<text class="l0" x="18" y="61" fill="#7ee787">$ python3 tiltmeter.py demo</text>
<text class="l1" x="18" y="81" fill="#c9d1d9">Simulated Jev, not real Jev numbers.</text>
<text class="l2" x="18" y="101" fill="#c9d1d9">1. 300 support tickets through the proxy on jev-1.12.0 ...</text>
<text class="l3" x="18" y="121" fill="#c9d1d9">   check: no alerts</text>
<text class="l4" x="18" y="141" fill="#c9d1d9">2. jev-latest now points at jev-1.13.0; 200 more tickets ...</text>
<text class="l5" x="18" y="161" fill="#c9d1d9">   check:</text>
<text class="l6" x="18" y="181" fill="#ff7b72">ALERT [version] support-app/department</text>
<text class="l7" x="18" y="201" fill="#8b949e">    model changed jev-1.12.0 -&gt; jev-1.13.0</text>
<text class="l8" x="18" y="221" fill="#ff7b72">ALERT [drift] support-app/department</text>
<text class="l9" x="18" y="241" fill="#8b949e">    answer distribution shifted, PSI 0.45 (p=2e-10); likely cause: model jev-1.12.0 -&gt; jev-1.13.0</text>
<text class="l10" x="18" y="261" fill="#ff7b72">ALERT [edge] support-app/department</text>
<text class="l11" x="18" y="281" fill="#8b949e">    28% of recent answers within 0.05 of threshold 0.7: decisions are fragile</text>
<text class="l12" x="18" y="301" fill="#ff7b72">ALERT [accuracy] support-app/department</text>
<text class="l13" x="18" y="321" fill="#8b949e">    estimated accuracy 83% -&gt; 63% (no labels; assumes calibration); likely cause: model jev-1.12.0 -&gt; jev-1.13.0</text>
<text class="l14" x="18" y="341" fill="#ff7b72">ALERT [version] support-app/is_urgent</text>
<text class="l15" x="18" y="361" fill="#8b949e">    model changed jev-1.12.0 -&gt; jev-1.13.0</text>
<text class="l16" x="18" y="381" fill="#ff7b72">ALERT [drift] support-app/is_urgent</text>
<text class="l17" x="18" y="401" fill="#8b949e">    answer distribution shifted, PSI 5.96 (p=2e-122); likely cause: model jev-1.12.0 -&gt; jev-1.13.0</text>
<text class="l18" x="18" y="421" fill="#ff7b72">ALERT [edge] support-app/is_urgent</text>
<text class="l19" x="18" y="441" fill="#8b949e">    26% of recent answers within 0.05 of threshold 0.7: decisions are fragile</text>
<text class="l20" x="18" y="461" fill="#ff7b72">ALERT [accuracy] support-app/is_urgent</text>
<text class="l21" x="18" y="481" fill="#8b949e">    estimated accuracy 79% -&gt; 53% (no labels; assumes calibration); likely cause: model jev-1.12.0 -&gt; jev-1.13.0</text>
</svg>
